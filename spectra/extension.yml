schema_version: "1.0"

extension:
  id: "spectra"
  name: "Spectra"
  version: "1.5.0"
  description: "TELUS Digital - Agentic software engineering across the entire SDLC."
  category: "workflow"
  effect: "read-write"
  author: "TELUS Digital"
  repository: "https://github.com/xavient/spectra"
  license: "Apache-2.0"
  homepage: "https://github.com/xavient/spectra/tree/main/spectra"

requires:
  # Bump this to the spec-kit version you actually test against.
  speckit_version: ">=0.11.0"
  tools:
    # Used by speckit.spectra.create-pr and speckit.spectra.review-pr at runtime. Kept optional at the
    # extension level because adr, brd, and domain-analyzer never touch GitHub — marking gh required
    # would block installation for users who only want those. Both GitHub commands hard-gate on gh at
    # run time: a missing binary or a failed `gh auth status` stops them before any other work, with
    # distinct remedies (install vs `gh auth login`). What each does *after* that gate differs —
    # create-pr hands over the manual git/gh commands and states whether the branch was pushed, while
    # review-pr hands over the rendered review body for manual posting.
    - name: git
      required: false
    - name: gh
      required: false

provides:
  commands:
    - name: "speckit.spectra.adr"
      file: "commands/adr.md"
      description: "Create a new Architecture Decision Record from a short description, grounded in the codebase and constitution."
    - name: "speckit.spectra.domain-analyzer"
      file: "commands/domain-analyzer.md"
      description: "Analyze the project, infer its domain, and write an opt-in proposal of candidate guardrails for SME review and handoff to /speckit-constitution."
    - name: "speckit.spectra.create-pr"
      file: "commands/create-pr.md"
      description: "Offer to open a correctly-targeted GitHub PR for the current spec branch after implementation, deriving the base from the promotion strategy and returning the PR URL."
    - name: "speckit.spectra.brd"
      file: "commands/brd.md"
      description: "Transform a raw business requirement (inline text or a .docx/.pdf/.md/.txt document) into a structured, specify-ready BRD under /brds, asking clarifying questions when needed, then hand off to the specify command."
    - name: "speckit.spectra.review-pr"
      file: "commands/review-pr.md"
      description: "Review a GitHub pull request against the spec, plan, tasks, ADRs, and constitution it carries, then publish a single human-curated review containing only the severity-ranked findings the reviewer individually selected."

hooks:
  after_implement:
    command: speckit.spectra.create-pr
    optional: true
    prompt: "Open a pull request for this spec?"
    description: "Offer to open a PR after implementation completes"

tags:
  - "documentation"
  - "architecture"
  - "adr"
  - "governance"
  - "constitution"
  - "guardrails"
  - "domain"
  - "delivery"
  - "pull-request"
  - "github"
  - "brd"
  - "requirements"
  - "review"
  - "code-review"
  - "workflow"
